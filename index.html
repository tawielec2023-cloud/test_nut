<!DOCTYPE html>
<html>
<head>
    <title>Test Firebase Web App</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body style="font-family: Arial; text-align: center; margin-top: 50px;">

    <h2>ทดสอบ Web App สั่งการ CH1</h2>
    
    <button onclick="turnOn()" style="padding: 15px 30px; font-size: 20px; background-color: #4CAF50; color: white;">ON (ส่งเลข 1)</button>
    <button onclick="turnOff()" style="padding: 15px 30px; font-size: 20px; background-color: #f44336; color: white;">OFF (ส่งเลข 0)</button>

    <script>
        // 1. ตั้งค่า Firebase ของคุณ
        var firebaseConfig = {
            apiKey: "AIzaSyCXKM44f0JodWD_mdUytWOQWScSs1vgAcE",
            databaseURL: "https://mynut095-default-rtdb.asia-southeast1.firebasedatabase.app"
        };
        
        // 2. เริ่มต้นการเชื่อมต่อ
        firebase.initializeApp(firebaseConfig);
        var database = firebase.database();

        // 3. ฟังก์ชันเมื่อกดปุ่ม ON (ส่งเลข 1 ไปที่ /SmartHome/CH1)
        function turnOn() {
            database.ref('/SmartHome/CH1').set(1)
            .then(() => alert("ส่งคำสั่ง ON (1) สำเร็จ! ลองดูที่ Serial Monitor"));
        }

        // 4. ฟังก์ชันเมื่อกดปุ่ม OFF (ส่งเลข 0 ไปที่ /SmartHome/CH1)
        function turnOff() {
            database.ref('/SmartHome/CH1').set(0)
            .then(() => alert("ส่งคำสั่ง OFF (0) สำเร็จ! ลองดูที่ Serial Monitor"));
        }
    </script>

</body>
</html>
